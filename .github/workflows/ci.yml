name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Prettier · Lint · Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Prettier · Lint · Typecheck
        run: pnpm format:check && pnpm lint && pnpm typecheck

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.16.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build verify
        env:
          # Build-time placeholders — real secrets live on Vercel only
          AUTH_SECRET: ci-build-placeholder-not-for-production
          DATABASE_URL: postgresql://ci:ci@127.0.0.1:5432/ci?schema=public
        run: pnpm build:verify

  # Always runs after quality + build (PR and main) so the check is never skipped.
  # PRs: verify deploy config only. main push: trigger the real production deploy.
  deploy:
    name: Deploy production
    needs: [quality, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Verify deploy hook is configured
        id: verify
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          HOOK=$(printf '%s' "$VERCEL_DEPLOY_HOOK" | tr -d '[:space:]')
          if [ -z "$HOOK" ]; then
            echo "::error::Missing VERCEL_DEPLOY_HOOK secret. In Vercel → Hearth → Settings → Git → Deploy Hooks, create a hook for branch main, then paste the URL into GitHub Actions secrets as VERCEL_DEPLOY_HOOK."
            exit 1
          fi
          case "$HOOK" in
            https://api.vercel.com/v1/integrations/deploy/*) ;;
            https://*)
              echo "::warning::Hook URL does not look like a Vercel Deploy Hook, continuing anyway."
              ;;
            *)
              echo "::error::VERCEL_DEPLOY_HOOK must be an https URL from Vercel Deploy Hooks."
              exit 1
              ;;
          esac
          echo "Deploy hook is configured."
          echo "hook<<EOF" >> "$GITHUB_OUTPUT"
          echo "$HOOK" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "PR check only — production deploy runs after merge to main."
          fi

      - name: Deploy to Vercel (production)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ steps.verify.outputs.hook }}
        run: |
          echo "Triggering production deploy hook…"
          curl -fsS -X POST "$HOOK"
          echo
          echo "Deploy hook accepted. Watch the deployment in the Vercel dashboard."
